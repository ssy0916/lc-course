[project]
name = "lc-course"
version = "0.2.0"
description = "A LangGraph recipe agent with a cited vector knowledge base"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alibabacloud-oss-v2>=1.4.0",
    "fastapi>=0.143.3",
    "langchain>=1.4.5",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.7.1",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph-cli[inmem]>=0.4.35",
    "notebook>=7.6.3",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
